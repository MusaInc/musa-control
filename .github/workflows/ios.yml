# Musa Control iPad + iPhone app: build + test on every push (simulator), and a
# manually-triggered TestFlight upload. There is no Mac on the VPS, so this
# GitHub-hosted macOS runner is the only place the app is compiled.
#
# Repository secrets: APPLE_TEAM_ID, ASC_KEY_ID (Admin team key — App Manager
# keys can't use cloud signing), ASC_ISSUER_ID, ASC_KEY_P8.
name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml", "tools/asc.py"]
  pull_request:
    paths: ["ios/**"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Archive + sign after the tests pass"
        type: boolean
        default: false
      upload:
        description: "Upload the signed build to TestFlight (off = sign and export the .ipa only)"
        type: boolean
        default: true
      version:
        description: "Marketing version (must be ≥ the highest on TestFlight)"
        default: "0.1.0"
      ui_tests:
        description: "Run the UI tests (screenshots of every section)"
        type: boolean
        default: true
      runner:
        description: "macOS runner image (macos-15-intel if arm64 capacity is short)"
        default: "macos-15"

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.testflight || 'ci' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}
    working-directory: ios

env:
  BUNDLE_ID: uk.co.musastudios.musacontrol

jobs:
  build-test:
    # On the TestFlight mirror repo (not MusaInc) only manual runs build:
    # pushes there are mirrors, and every macOS minute counts 10x.
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'MusaInc'
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          xcodebuild -resolvePackageDependencies -project MusaControl.xcodeproj -scheme MusaControl -skipPackagePluginValidation | tail -5

      - name: Pick an iPad simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d = json.load(sys.stdin)["devices"]
          c = [(r, x) for r, xs in d.items() if "iOS" in r for x in xs if "iPad Pro 13" in x["name"]] or \
              [(r, x) for r, xs in d.items() if "iOS" in r for x in xs if "iPad" in x["name"]]
          c.sort(key=lambda t: t[0])
          print(c[-1][1]["udid"])')
          echo "SIM=$udid" >> $GITHUB_ENV
          xcrun simctl list devices | grep "$udid"
          phone=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d = json.load(sys.stdin)["devices"]
          c = [(r, x) for r, xs in d.items() if "iOS" in r for x in xs if x["name"].startswith("iPhone 16 Pro") or x["name"].startswith("iPhone 17 Pro")] or \
              [(r, x) for r, xs in d.items() if "iOS" in r for x in xs if x["name"].startswith("iPhone")]
          c.sort(key=lambda t: t[0])
          print(c[-1][1]["udid"])')
          echo "PHONE=$phone" >> $GITHUB_ENV
          xcrun simctl list devices | grep "$phone"

      - name: Build and run unit tests
        run: |
          mkdir -p build
          xcodebuild test -project MusaControl.xcodeproj -scheme MusaControl -skipPackagePluginValidation -skipMacroValidation \
            -destination "id=$SIM" -only-testing:MusaControlTests \
            -resultBundlePath build/unit.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/unit.log \
            | awk '/error:|\*\* |Test Case .*(passed|failed)|Executed [0-9]/ && n++ < 500'

      - name: UI tests (screenshots of every section, landscape + portrait)
        if: github.event_name != 'workflow_dispatch' || inputs.ui_tests
        continue-on-error: true
        run: |
          xcodebuild test -project MusaControl.xcodeproj -scheme MusaControl -skipPackagePluginValidation -skipMacroValidation \
            -destination "id=$SIM" -only-testing:MusaControlUITests -skip-testing:MusaControlUITests/MusaControlPhoneUITests \
            -resultBundlePath build/ui.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ui.log \
            | awk '/error:|\*\* |Test Case .*(passed|failed)|Executed [0-9]/ && n++ < 300'

      - name: iPhone UI tests (tab bar, list → detail navigation, every section)
        if: github.event_name != 'workflow_dispatch' || inputs.ui_tests
        continue-on-error: true
        run: |
          xcodebuild test -project MusaControl.xcodeproj -scheme MusaControl -skipPackagePluginValidation -skipMacroValidation \
            -destination "id=$PHONE" -only-testing:MusaControlUITests/MusaControlPhoneUITests \
            -resultBundlePath build/phone.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/phone.log \
            | awk '/error:|\*\* |Test Case .*(passed|failed)|Executed [0-9]/ && n++ < 300'

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screens
          for r in build/*.xcresult; do
            xcrun xcresulttool export attachments --path "$r" --output-path build/screens/$(basename "$r" .xcresult) 2>/dev/null || true
          done
          find build/screens -type f | head -80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ github.run_number }}
          path: |
            ios/build/screens
            ios/build/*.log
          retention-days: 14

  testflight:
    needs: build-test
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build number
        # A second (TestFlight-only) repo restarts the run counter at 1: the repo
        # variable BUILD_BASE carries the numbering on from the main repo.
        env: { BUILD_BASE: "${{ vars.BUILD_BASE }}" }
        run: |
          n=$(( GITHUB_RUN_NUMBER + ${BUILD_BASE:-0} ))
          echo "BUILD=$n" >> "$GITHUB_ENV"
          echo "Build number $n"


      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"

      - name: App Store Connect key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$P8" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography

      - name: Check the app record and version
        if: inputs.upload
        env: { KEY_ID: "${{ secrets.ASC_KEY_ID }}", ISSUER: "${{ secrets.ASC_ISSUER_ID }}" }
        run: |
          python3 ../tools/asc.py check-app "$BUNDLE_ID"
          python3 ../tools/asc.py min-version "$BUNDLE_ID" "${{ inputs.version }}"

      - name: Generate the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"${{ inputs.version }}\"/; s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"$BUILD\"/" project.yml
          xcodegen generate

      - name: Archive (unsigned; the export step signs with the cloud-managed certificate)
        env: { TEAM: "${{ secrets.APPLE_TEAM_ID }}" }
        run: |
          xcodebuild -project MusaControl.xcodeproj -scheme MusaControl -configuration Release -skipPackagePluginValidation -skipMacroValidation \
            -destination "generic/platform=iOS" -archivePath build/MusaControl.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" | tail -40

      - name: Sign and upload to TestFlight
        env: { TEAM: "${{ secrets.APPLE_TEAM_ID }}", KEY_ID: "${{ secrets.ASC_KEY_ID }}", ISSUER: "${{ secrets.ASC_ISSUER_ID }}" }
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${{ inputs.upload && 'upload' || 'export' }}</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/MusaControl.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/upload \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -40
          echo "Signed ${{ inputs.version }} ($BUILD); uploaded: ${{ inputs.upload }}"
          ls -la build/upload || true

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.upload }}
        with:
          name: signed-ipa-${{ github.run_number }}
          path: ios/build/upload
          retention-days: 7

      - name: Remove the key
        if: always()
        run: rm -rf "$HOME/private_keys"

  # Waiting for Apple's processing is just API polling (often 15-30 min):
  # a Linux runner does it at a tenth of the macOS price.
  testable:
    needs: testflight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight && inputs.upload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build number
        # A second (TestFlight-only) repo restarts the run counter at 1: the repo
        # variable BUILD_BASE carries the numbering on from the main repo.
        env: { BUILD_BASE: "${{ vars.BUILD_BASE }}" }
        run: |
          n=$(( GITHUB_RUN_NUMBER + ${BUILD_BASE:-0} ))
          echo "BUILD=$n" >> "$GITHUB_ENV"
          echo "Build number $n"

      - name: App Store Connect key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$P8" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography

      - name: Wait for Apple processing
        if: inputs.upload
        timeout-minutes: 45
        env: { KEY_ID: "${{ secrets.ASC_KEY_ID }}", ISSUER: "${{ secrets.ASC_ISSUER_ID }}" }
        run: python3 ../tools/asc.py wait "$BUNDLE_ID" "$BUILD"

      - name: Make it testable (compliance + internal testers)
        if: inputs.upload
        env: { KEY_ID: "${{ secrets.ASC_KEY_ID }}", ISSUER: "${{ secrets.ASC_ISSUER_ID }}" }
        run: python3 ../tools/asc.py testable "$BUNDLE_ID" "$BUILD"

      - name: Remove the key
        if: always()
        run: rm -rf "$HOME/private_keys"
